    <filter id="key" x="-20%" y="-35%" width="140%" height="170%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="2.6"/></filter>
    <filter id="contact" x="-20%" y="-35%" width="140%" height="170%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="1"/></filter>
