name: Release publish
run-name: PCL SU ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version matching metadata.json (for example 2.15.3)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_REF" == "refs/heads/dev" ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_VERSION" = "$(jq -r '.version.base' 'Plain Craft Launcher 2/metadata.json')"
          test -z "$(jq -r '.version.suffix' 'Plain Craft Launcher 2/metadata.json')"
          grep -Fq "<AssemblyVersion>$RELEASE_VERSION.0</AssemblyVersion>" 'Plain Craft Launcher 2/Plain Craft Launcher 2.csproj'
          grep -Fq "<FileVersion>$RELEASE_VERSION.0</FileVersion>" 'Plain Craft Launcher 2/Plain Craft Launcher 2.csproj'
          test -s "release-notes/$RELEASE_VERSION.md"
          python - "$RELEASE_VERSION" <<'PY'
          import pathlib, re, sys
          text = pathlib.Path(f"release-notes/{sys.argv[1]}.md").read_text(encoding="utf-8-sig")
          summaries = re.findall(r"<summary>(.*?)</summary>", text, re.S)
          assert text.count("<summary>") == text.count("</summary>") == 1, "Expected exactly one summary"
          assert len(summaries) == 1 and summaries[0].strip(), "Missing update summary"
          assert not re.search(r"[<>\r\n]", summaries[0]), "Summary must be one line of plain text"
          assert text.split("</summary>", 1)[1].strip(), "Missing player-facing release details"
          PY
          tag="v$RELEASE_VERSION"
          if existing_sha=$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha' 2>/dev/null); then
            test "$existing_sha" = "$RELEASE_SHA"
          fi
          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            test "$draft" = "true"
          fi

  test:
    needs: validate
    uses: ./.github/workflows/reusable-test.yml

  build:
    needs: [validate, test]
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, ARM64]
    uses: ./.github/workflows/reusable-build.yml
    with:
      configuration: Release
      architecture: ${{ matrix.architecture }}
      require-ms-client-id: true
      require-curseforge-key: true
    secrets: inherit

  publish:
    needs: [validate, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: PCL_SU_Release_*
          merge-multiple: true
          path: dist

      - name: Verify packages
        working-directory: dist
        run: |
          set -euo pipefail
          test -s PCL_SU_Release_x64.exe
          test -s PCL_SU_Release_ARM64.exe
          sha256sum --check PCL_SU_Release_x64.exe.sha256 PCL_SU_Release_ARM64.exe.sha256

      - name: Sign and verify binaries
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: dist/PCL_SU_Release_x64.exe dist/PCL_SU_Release_ARM64.exe
          verify: true
          verify-cert-identity: https://github.com/${{ github.workflow_ref }}
          verify-oidc-issuer: https://token.actions.githubusercontent.com
          upload-signing-artifacts: false

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v$RELEASE_VERSION"
          for arch in x64 ARM64; do
            test -s "dist/PCL_SU_Release_$arch.exe.sigstore.json"
          done
          if existing_sha=$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha' 2>/dev/null); then
            test "$existing_sha" = "$RELEASE_SHA"
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$RELEASE_SHA"
          fi
          if draft=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            test "$draft" = "true"
            gh release edit "$tag" --title "PCL SU $RELEASE_VERSION" --notes-file "release-notes/$RELEASE_VERSION.md"
          else
            gh release create "$tag" --verify-tag --draft --title "PCL SU $RELEASE_VERSION" --notes-file "release-notes/$RELEASE_VERSION.md"
          fi
          gh release upload "$tag" dist/*.exe dist/*.sha256 dist/*.sigstore.json --clobber
          test "$(gh release view "$tag" --json assets --jq '.assets | length')" -eq 6
          gh release edit "$tag" --draft=false --prerelease=false --latest
          echo "Published: https://github.com/$GH_REPO/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
