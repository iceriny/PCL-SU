name: Build (Reusable)

on:
  workflow_call:
    inputs:
      configuration:
        required: true
        type: string
      architecture:
        required: true
        type: string
      require-ms-client-id:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ inputs.configuration }} / ${{ inputs.architecture }}
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      BUILD_CONFIGURATION: ${{ inputs.configuration }}
      BUILD_ARCHITECTURE: ${{ inputs.architecture }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.403

      - name: Build and package
        env:
          REQUIRE_MS_CLIENT_ID: ${{ inputs.require-ms-client-id }}
          PCL_WRITE_SECRET: '1'
          PCL_MS_CLIENT_ID: ${{ secrets.PCL_MS_CLIENT_ID }}
          PCL_CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          PCL_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          PCL_NAID_CLIENT_ID: ${{ secrets.NAID_CLIENT_ID }}
          PCL_NAID_CLIENT_SECRET: ${{ secrets.NAID_CLIENT_SECRET }}
          PCL_LINK_SERVER_ROOT: ${{ secrets.LINK_SERVER_ROOTS }}
          PCL_LOBBY_DEFAULT_SECRET: ${{ secrets.LOBBY_DEFAULT_SECRET }}
          PCL_LOBBY_REPORT_ENDPOINT: ${{ secrets.LOBBY_REPORT_ENDPOINT }}
          PCL_TELEMETRY_KEY: ${{ secrets.TELEMETRY_KEY }}
          PCL_LOBBY_PRIVACY_URL: ${{ secrets.LOBBY_PRIVACY_URL }}
          PCL_GITHUB_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:BUILD_CONFIGURATION -notin @('CI', 'Release', 'Beta')) { throw 'Invalid configuration' }
          if ($env:BUILD_ARCHITECTURE -notin @('x64', 'ARM64')) { throw 'Invalid architecture' }
          if ($env:REQUIRE_MS_CLIENT_ID -eq 'true' -and [string]::IsNullOrWhiteSpace($env:PCL_MS_CLIENT_ID)) {
            throw 'Set the PCL_MS_CLIENT_ID repository secret before publishing a release.'
          }
          dotnet publish 'Plain Craft Launcher 2/Plain Craft Launcher 2.csproj' -c $env:BUILD_CONFIGURATION -p:Platform=$env:BUILD_ARCHITECTURE -p:UseSharedCompilation=false --no-self-contained --output ./publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }

          New-Item -ItemType Directory -Path artifact | Out-Null
          $assetName = "PCL_SU_$($env:BUILD_CONFIGURATION)_$($env:BUILD_ARCHITECTURE).exe"
          $asset = Join-Path artifact $assetName
          Copy-Item -LiteralPath 'publish/Plain Craft Launcher 2.exe' -Destination $asset
          if (-not [string]::IsNullOrWhiteSpace($env:PCL_MS_CLIENT_ID)) {
            $binaryText = [Text.Encoding]::Unicode.GetString([IO.File]::ReadAllBytes($asset))
            if (-not $binaryText.Contains($env:PCL_MS_CLIENT_ID)) { throw 'Microsoft client ID was not embedded' }
          }
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$asset.sha256" -Value "$hash  $assetName" -Encoding utf8NoBOM
          "Asset: $assetName; SHA256: $hash" >> $env:GITHUB_STEP_SUMMARY
          "Microsoft login configured: $(-not [string]::IsNullOrWhiteSpace($env:PCL_MS_CLIENT_ID))" >> $env:GITHUB_STEP_SUMMARY
          "CurseForge official API configured: $(-not [string]::IsNullOrWhiteSpace($env:PCL_CURSEFORGE_API_KEY))" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL_SU_${{ inputs.configuration }}_${{ inputs.architecture }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
