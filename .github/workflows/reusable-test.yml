name: Test (Reusable)

permissions:
  contents: read

on:
  workflow_call:

jobs:
  regression:
    name: Windows regressions
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.403

      - name: Run regression tests
        run: |
          $resultsDirectory = Join-Path $env:RUNNER_TEMP 'PCLSU-TestResults'
          $testRoot = Join-Path $env:RUNNER_TEMP 'PCLSU-TestRoot'
          ./scripts/Invoke-RegressionTests.ps1 -ResultsDirectory $resultsDirectory -TestRoot $testRoot

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL_SU_Regression_Results
          path: ${{ runner.temp }}/PCLSU-TestResults/*.trx
          if-no-files-found: warn
