name: Test (Reusable)

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      build-metadata:
        type: string
        default: ''
      release-metadata-artifact:
        type: string
        default: ''

jobs:
  regression:
    name: Windows regressions
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      BUILD_METADATA: ${{ inputs.build-metadata }}
      RELEASE_METADATA_ARTIFACT: ${{ inputs.release-metadata-artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.403

      - name: Download prepared release metadata
        if: ${{ inputs.release-metadata-artifact != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.release-metadata-artifact }}
          path: artifacts/build/release-metadata

      - name: Run regression tests
        run: |
          $resultsDirectory = Join-Path $env:RUNNER_TEMP 'PCLSU-TestResults'
          $testRoot = Join-Path $env:RUNNER_TEMP 'PCLSU-TestRoot'
          $testArguments = @{ ResultsDirectory = $resultsDirectory; TestRoot = $testRoot }
          if (-not [string]::IsNullOrWhiteSpace($env:BUILD_METADATA)) { $testArguments.BuildMetadata = $env:BUILD_METADATA }
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_METADATA_ARTIFACT)) {
            $testArguments.ReleaseNotesPath = Join-Path (Get-Location) 'artifacts/build/release-metadata/notes'
          }
          ./scripts/Invoke-RegressionTests.ps1 @testArguments

      - name: Upload regression results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PCL_SU_Regression_Results
          path: ${{ runner.temp }}/PCLSU-TestResults/*.trx
          if-no-files-found: warn
